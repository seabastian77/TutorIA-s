name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pruebas:
    name: Sintaxis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias del proyecto
        run: npm install
      - name: Instalar dependencias del backend
        run: npm install --prefix src/backend
      # El script revisa también los módulos ES del frontend (Tuti 3D), que node --check solo no acepta en Node 20
      - name: Revisar que todo el JavaScript compile
        run: npm run lint:sintaxis
      - name: Correr las pruebas
        run: npm test
